{% extends "base.html" %}

{% block title %}Παρουσιάστε κάτι{% endblock title %}

{% block content %}
<section class="mb-16">
  <div class="bg-white rounded-lg shadow-lg overflow-hidden max-w-2xl mx-auto">
    <div class="bg-py-accent text-white p-6">
      <h1 class="text-2xl font-bold">Παρουσιάστε κάτι</h1>
      <p class="mt-2 text-blue-100">
        Έχετε κάτι ενδιαφέρον να μοιραστείτε; Όχι; Δεν πειράζει, κάτι θα βρείτε.
      </p>
    </div>
    <div class="p-6 sm:p-8">
      <form id="present-form" class="space-y-5" method="post">
        <div>
          <label class="block text-sm font-semibold text-python-blue mb-1" for="present-name">
            Όνομα
          </label>
          <input
            id="present-name"
            name="name"
            type="text"
            required
            class="w-full rounded-md border border-gray-300 px-4 py-2 focus:ring-2 focus:ring-python-blue focus:outline-none"
          />
        </div>
        <div>
          <label class="block text-sm font-semibold text-python-blue mb-1" for="present-email">
            Email
          </label>
          <input
            id="present-email"
            name="email"
            type="email"
            required
            class="w-full rounded-md border border-gray-300 px-4 py-2 focus:ring-2 focus:ring-python-blue focus:outline-none"
          />
        </div>
        <div>
          <label class="block text-sm font-semibold text-python-blue mb-1" for="present-title">
            Τίτλος παρουσίασης
          </label>
          <input
            id="present-title"
            name="title"
            type="text"
            required
            class="w-full rounded-md border border-gray-300 px-4 py-2 focus:ring-2 focus:ring-python-blue focus:outline-none"
          />
        </div>
        <div>
          <label class="block text-sm font-semibold text-python-blue mb-1" for="present-description">
            Περιγραφή
          </label>
          <textarea
            id="present-description"
            name="description"
            required
            rows="5"
            class="w-full rounded-md border border-gray-300 px-4 py-2 focus:ring-2 focus:ring-python-blue focus:outline-none resize-y"
          ></textarea>
        </div>
        <div>
          <label class="block text-sm font-semibold text-python-blue mb-1" for="present-comments">
            Σχόλια
          </label>
          <textarea
            id="present-comments"
            name="comments"
            rows="3"
            placeholder="Γράψτε τι χρώμα M&amp;Ms δε θέλετε να έχει το μπολάκι, πότε σας βολεύει, κτλ"
            class="w-full rounded-md border border-gray-300 px-4 py-2 focus:ring-2 focus:ring-python-blue focus:outline-none resize-y"
          ></textarea>
        </div>
        <div class="cf-turnstile" data-sitekey="0x4AAAAAACjhhMHzs4kxktwU"></div>
        <button
          type="submit"
          class="w-full inline-flex items-center justify-center px-4 py-2 rounded-md text-white bg-py-accent hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-python-blue transition disabled:opacity-70"
        >
          <svg
            class="h-5 w-5 mr-2 hidden animate-spin"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
          >
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path
              class="opacity-75"
              fill="currentColor"
              d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"
            ></path>
          </svg>
          <span class="button-text">Υποβολή</span>
        </button>
        <p class="text-sm text-red-600" id="present-error"></p>
      </form>
      <div
        id="present-success"
        class="hidden bg-green-50 border border-green-200 text-green-800 rounded-md p-4"
      >
        <p class="font-semibold mb-1">Σούπερ!</p>
        <p class="text-sm">Ένα πράμα έμεινε, <a href="https://discord.gg/U9bRsHfvBy" target="_blank" class="text-green-700 underline hover:text-green-900">
            <i class="fa-brands fa-discord"></i> μπείτε στο Discord μας
          </a> να συνεννοηθούμε.
        </p>
      </div>
    </div>
  </div>
</section>

<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    var form = document.getElementById("present-form");
    if (form) {
      var submitButton = form.querySelector("button");
      var spinner = submitButton.querySelector("svg");
      var buttonText = submitButton.querySelector(".button-text");
      var successBox = document.getElementById("present-success");
      var errorMessage = document.getElementById("present-error");

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        errorMessage.textContent = "";
        submitButton.disabled = true;
        spinner.classList.remove("hidden");
        buttonText.textContent = "Αποστολή...";

        var formData = new FormData(form);

        fetch("/api/present", {
          method: "POST",
          body: formData,
        })
          .then(function (response) {
            if (!response.ok) {
              throw new Error("Submission failed");
            }

            form.classList.add("hidden");
            successBox.classList.remove("hidden");
          })
          .catch(function () {
            errorMessage.textContent = "Κάτι πήγε στραβά. Δοκιμάστε ξανά σε λίγο.";
            submitButton.disabled = false;
            spinner.classList.add("hidden");
            buttonText.textContent = "Υποβολή";
          });
      });
    }
  });
</script>
{% endblock %}
