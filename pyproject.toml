[project]
name = "pythess"
version = "0.1.0"
description = "The website and files for the Python meetup"
authors = [
    { name = "Stavros Korokithakis", email = "hi@stavros.io" },
]
readme = "README.md"
# No .python-version on purpose: Cloudflare Pages would compile that exact
# version from source (~3.5 min). With no pin it uses its preinstalled 3.13.x.
# The <3.14 cap keeps local uv on 3.13 too; the locked deps have no 3.14 wheels.
requires-python = ">=3.13,<3.14"
dependencies = [
    "django-distill>=3.2.7",
    "django-extensions>=3.2.3",
    "django>=5.1.5",
    "werkzeug>=3.1.3",
    "django-markdownify>=0.9.5",
    "anthropic>=0.49.0",
    "ics>=0.7.2",
    "openai>=1.0.0",
    "pillow>=10.0.0",
]


[tool.setuptools]
py-modules = []
packages = []

[tool.poetry]
package-mode = false

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
